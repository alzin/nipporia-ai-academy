# Deploys academy.nipporia.com to Cloud Run on every push (or merged PR) to main.
# No keys are stored in GitHub: the job signs in to Google Cloud with Workload Identity
# Federation, which only trusts this repository's main branch (alzin/nipporia-ai-academy).
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/345401791489/locations/global/workloadIdentityPools/github/providers/nipporia-academy
          service_account: academy-deployer@nipporia-lp-493210.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: bash deploy/deploy.sh

      - name: Check the live site
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://academy.nipporia.com/api/health || true)
            [ "$code" = "200" ] && { echo "Live: /api/health returned 200"; exit 0; }
            sleep 10
          done
          echo "academy.nipporia.com/api/health did not return 200 (last: $code)"; exit 1
